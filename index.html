<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Control de Aseo — Mdreieck</title>
  <link rel="icon" href="logo-mdreieck.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="app">
    <header class="barra">
      <img src="logo-mdreieck.png" alt="Mdreieck S.A de C.V" class="logo">
      <div class="barra-titulo">
        <span class="sub" id="barra-sub">Control de aseo</span>
        <h1 id="barra-titulo">Aseo de hoy</h1>
      </div>
    </header>

    <main id="vista" class="vista" aria-live="polite"></main>

    <nav class="nav" aria-label="Secciones">
      <button class="nav-btn" data-vista="hoy">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>Hoy</button>
      <button class="nav-btn" data-vista="plan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Plan por área</button>
      <button class="nav-btn" data-vista="calendario">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendario</button>
      <button class="nav-btn" data-vista="reporte">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>Reporte</button>
    </nav>
  </div>

  <!-- Cierre de revisión: nombre + firma dibujada -->
  <dialog id="dlg-cierre" class="dialogo" aria-labelledby="dlg-titulo">
    <form method="dialog" id="form-cierre" class="dialogo-cuerpo">
      <div>
        <span class="sub">Cerrar revisión</span>
        <h2 id="dlg-titulo">Área</h2>
      </div>
      <p id="dlg-aviso" class="aviso" hidden></p>
      <label for="cierre-nombre" class="etiqueta">Nombre completo de quien revisó</label>
      <input id="cierre-nombre" class="campo" type="text" autocomplete="name" required minlength="3" maxlength="120" placeholder="Ej. María López Hernández">
      <div class="firma-cab">
        <span class="etiqueta">Firma</span>
        <button type="button" class="btn-texto" id="cierre-limpiar">Borrar firma</button>
      </div>
      <canvas id="cierre-firma" class="firma" aria-label="Área para firmar con el dedo"></canvas>
      <label for="cierre-obs" class="etiqueta">Observaciones (opcional)</label>
      <textarea id="cierre-obs" class="campo" rows="2" maxlength="1000" placeholder="Ej. Falta jabón en lavabo derecho"></textarea>
      <div class="dialogo-acciones">
        <button type="button" class="btn btn-sec" id="cierre-cancelar">Cancelar</button>
        <button type="submit" class="btn btn-pri" id="cierre-guardar">Firmar y cerrar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="firma.js"></script>
  <script src="app.js"></script>
</body>
</html>
